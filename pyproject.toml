[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tabpfn-ir"
version = "0.1.0"
description = "Row retrieval baselines for TabPFN-style in-context tabular models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faiss-cpu>=1.8,<2",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
benchmark = [
    "openml>=0.15,<1",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "tabpfn==8.2.0",
]
tracking = [
    "tensorboard>=2.16,<3",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
